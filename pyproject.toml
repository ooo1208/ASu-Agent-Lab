[project]
name = "erp-openclaw"
version = "0.1.0"
description = "An auditable agent engineering lab with ERP actions, financial evidence and asynchronous evaluation."
authors = [
    { name = "ooo1208" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
keywords = [
    "agent",
    "langgraph",
    "mcp",
    "procurement",
    "sandbox",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "beautifulsoup4==4.14.3",
    "deepagents==0.5.0",
    "fastapi==0.135.1",
    "fastmcp==3.2.4",
    "httpx==0.28.1",
    "langchain-mcp-adapters==0.2.2",
    "langchain-openai==1.1.12",
    "langgraph==1.2.11",
    "langgraph-api==0.13.4",
    "langgraph-checkpoint-mongodb==0.4.0",
    "langgraph-cli[inmem]==0.4.31",
    "lxml==6.0.2",
    "markdownify==1.2.2",
    "opensandbox==0.1.7",
    "pymongo==4.15.3",
    "pypdf==6.18.0",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.0.1",
    "pyyaml==6.0.3",
    "requests==2.33.0",
    "uvicorn==0.42.0",
    "zai-sdk==0.2.2",
    "loguru>=0.7.3",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "api_view*", "mcp_server*", "asu_lab*", "asu_eval*", "asu_finance*"]
exclude = ["test*"]
namespaces = false

[tool.setuptools.package-data]
agent = ["memory/*.md", "subagents/configs/*.yaml"]
asu_lab = ["prompts/v1/*.md"]
mcp_server = ["html_quote/*.html"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.8.2",
]
