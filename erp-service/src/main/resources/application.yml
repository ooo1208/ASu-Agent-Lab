server:
  address: ${ERP_BIND_ADDRESS:127.0.0.1}
  port: ${ERP_PORT:8080}
spring:
  application:
    name: asu-erp
  datasource:
    url: jdbc:h2:file:./data/erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
erp:
  seed-enabled: ${ERP_SEED_ENABLED:true}
  api-key: ${ERP_API_KEY:}
